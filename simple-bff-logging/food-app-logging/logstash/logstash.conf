input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {

  mutate {
    add_field => {
      "environment" => "dev"
    }
  }

}

output {

  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservices-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}