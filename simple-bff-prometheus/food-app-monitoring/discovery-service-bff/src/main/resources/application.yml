server:
  port: 8761

spring:
  application:
    name: discovery-service

management:

  endpoints:
    web:
      exposure:
        include: "*"

  prometheus:
    metrics:
      export:
        enabled: true

  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    correlation: "[${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false