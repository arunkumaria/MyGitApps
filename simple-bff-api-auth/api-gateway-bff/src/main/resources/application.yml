server:
  port: 8080

spring:
  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: bff-service
          uri: http://localhost:8085
          predicates:
            - Path=/bff/**

logging:
  level:
    reactor.netty: DEBUG