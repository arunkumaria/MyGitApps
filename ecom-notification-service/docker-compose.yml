services:

  # ==========================================================
  # NOTIFICATION MYSQL
  # ==========================================================

  notification-mysql:

    image: mysql:8.4

    container_name: notification-mysql

    environment:

      MYSQL_ROOT_PASSWORD: dinavella5

      MYSQL_DATABASE: notification_db

    ports:

      - "3308:3306"

    volumes:

      - notification_mysql_data:/var/lib/mysql

    networks:

      - marketing-network

    restart: unless-stopped


  # ==========================================================
  # NOTIFICATION REDIS
  # ==========================================================

  notification-redis:

    image: redis:7-alpine

    container_name: notification-redis

    ports:

      - "6380:6379"

    networks:

      - marketing-network

    restart: unless-stopped


  # ==========================================================
  # NOTIFICATION SERVICE
  # ==========================================================

  notification-service:

    build: .

    container_name: notification-service

    ports:

      - "8083:8083"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://notification-mysql:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: dinavella5

      SPRING_REDIS_HOST: notification-redis

      SPRING_REDIS_PORT: 6379

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

    depends_on:

      - notification-mysql
      - notification-redis
      - kafka
      - zipkin

    networks:

      - marketing-network

    restart: unless-stopped


  # ==========================================================
  # PROMETHEUS
  # ==========================================================

  prometheus:

    image: prom/prometheus:latest

    container_name: notification-prometheus

    ports:

      - "9091:9090"

    volumes:

      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:

      - notification-service

    networks:

      - marketing-network

    restart: unless-stopped


  # ==========================================================
  # GRAFANA
  # ==========================================================

  grafana:

    image: grafana/grafana:latest

    container_name: notification-grafana

    ports:

      - "3001:3000"

    depends_on:

      - prometheus

    networks:

      - marketing-network

    restart: unless-stopped


  # ==========================================================
  # ZIPKIN
  # ==========================================================

  zipkin:

    image: openzipkin/zipkin:latest

    container_name: notification-zipkin

    ports:

      - "9412:9411"

    networks:

      - marketing-network

    restart: unless-stopped


  # ==========================================================
  # ELASTICSEARCH
  # ==========================================================

  elasticsearch:

    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0

    container_name: notification-elasticsearch

    environment:

      discovery.type: single-node

      xpack.security.enabled: "false"

      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:

      - "9201:9200"

    volumes:

      - notification_elasticsearch_data:/usr/share/elasticsearch/data

    networks:

      - marketing-network

    restart: unless-stopped


  # ==========================================================
  # LOGSTASH
  # ==========================================================

  logstash:

    image: docker.elastic.co/logstash/logstash:8.15.0

    container_name: notification-logstash

    ports:

      - "5001:5000"

    volumes:

      - ./monitoring/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro

    depends_on:

      - elasticsearch

    networks:

      - marketing-network

    restart: unless-stopped


  # ==========================================================
  # KIBANA
  # ==========================================================

  kibana:

    image: docker.elastic.co/kibana/kibana:8.15.0

    container_name: notification-kibana

    ports:

      - "5602:5601"

    environment:

      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

    depends_on:

      - elasticsearch

    networks:

      - marketing-network

    restart: unless-stopped


networks:

  marketing-network:
    driver: bridge


volumes:

  notification_mysql_data:

  notification_elasticsearch_data: