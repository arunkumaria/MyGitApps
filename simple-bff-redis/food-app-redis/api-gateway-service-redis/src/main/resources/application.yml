spring:
  cloud:
    gateway:
      routes:

        - id: food-service
          uri: lb://food-service
          predicates:
            - Path=/foods/**

        - id: restaurant-service
          uri: lb://restaurant-service
          predicates:
            - Path=/restaurants/**

        - id: bff-service
          uri: lb://bff-service
          predicates:
            - Path=/dashboard/**